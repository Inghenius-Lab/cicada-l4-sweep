name: l4-sweep
on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Trozos por celda (20 => cada trozo dura ~1 h en un runner)"
        required: false
        default: "20"
      cells:
        description: "Celdas, separadas por coma. Solo las 'pair' tienen barra re-ajustada."
        required: false
        default: "L4-php_mt_scale-pair,L4-php_mt_mod-pair,L4-php_php_scale-pair"
      smoke:
        description: "PRUEBA: 1 trozo por celda y rango diminuto. Comprueba que TODOS los jobs van bien en minutos. NO produce datos."
        type: boolean
        required: false
        default: false

# Repo PUBLICO: los runners estandar no cuestan nada (docs.github.com/en/billing/
# reference/actions-minute-multipliers). OJO, eso es solo para los runners
# estandar: "The larger runners are not free for public repositories".
# Limites verificados en docs.github.com/en/actions/reference/limits:
#   20 jobs concurrentes (plan Free) · 6 h por job · 256 jobs por matriz
#   500 MB de artefactos (Free)
# Por eso las celdas van troceadas y por eso hay modo smoke.

env:
  UPSTREAM: Dukotah/cicada3301
  UPSTREAM_REF: f08b20b632d91209ddbaa747e8e2f23df0c78ba1

jobs:
  preparar:
    name: preparar (motor + 25 puertas)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matriz: ${{ steps.planes.outputs.matriz }}
      shards: ${{ steps.planes.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      - name: dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php gcc python3-numpy python3-scipy >/dev/null
          php --version | head -1
          gcc --version | head -1
          python3 -c "import numpy, scipy; print('  numpy', numpy.__version__, ' scipy', scipy.__version__)"

      # DOS VECES QUE ME COSTO ESTO, APUNTADO:
      #   1) actions/checkout con ref=<SHA> y fetch-depth:1 hace fetch de una ref
      #      que no existe y muere.
      #   2) con fetch-depth:0 tampoco: para OTRO repo, checkout solo acepta una
      #      rama o una etiqueta, y un SHA suelto da
      #      "A branch or tag with the name 'f08b20b' could not be found".
      # Asi que el clon va a mano: fetch directo por SHA, que GitHub si admite.
      - name: clon del upstream (solo para leer las fuentes)
        run: |
          set -e
          git init -q upstream
          cd upstream
          git remote add origin "https://github.com/${{ env.UPSTREAM }}.git"
          git fetch --depth 1 --filter=blob:none origin "${{ env.UPSTREAM_REF }}"
          git checkout -q FETCH_HEAD
          echo "HEAD = $(git rev-parse HEAD)"
          [ "$(git rev-parse HEAD)" = "${{ env.UPSTREAM_REF }}" ] \
            || { echo "el SHA no coincide"; exit 1; }

      # CONTROL PREVIO. Va DESPUES del clon, no antes: ya lo ejecute antes una
      # vez y fallo banalmente porque upstream/ aun no existia.
      - name: control previo de la cadena
        run: python3 bin/preflight.py upstream/liber-primus

      - name: motor + puertas
        run: bash bin/preparar.sh "$PWD/upstream/liber-primus" "$PWD/panel/panel.npz" "$PWD/work"

      # La matriz se GENERA aqui, a partir de los mismos datos que los planes,
      # y se pasa al job de barrido. Asi no se puede desincronizar.
      - name: planes troceados
        id: planes
        run: |
          set -e
          if [ "${{ inputs.smoke }}" = "true" ]; then
            echo "### MODO SMOKE: 1 trozo por celda, 1.500.000 semillas. NO produce datos."
            python3 bin/planes.py work/dist work/planes 1 dist ${{ inputs.cells }} --max-seeds 1500000
          else
            python3 bin/planes.py work/dist work/planes "${{ inputs.shards }}" dist ${{ inputs.cells }}
          fi
          N=$(ls work/planes/*.json | grep -v matriz | wc -l)
          echo "planes: $N"
          [ "$N" -gt 0 ] || { echo "no se genero ningun plan"; exit 1; }
          echo "shards=${{ inputs.shards }}" >> "$GITHUB_OUTPUT"
          echo "matriz=$(cat work/planes/matriz.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: work/dist
      - uses: actions/upload-artifact@v4
        with:
          name: planes
          path: work/planes

  barrer:
    name: ${{ matrix.celda }} trozo ${{ matrix.trozo }}
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preparar.outputs.matriz) }}
    steps:
      # ⭐ ESTE CHECKOUT ES LO QUE FALTABA Y HACIA FALLAR LOS 5 PRIMEROS JOBS.
      # "GitHub provisions an isolated virtual machine for each job"
      # (docs.github.com/en/actions/how-tos/manage-runners/github-hosted-runners/
      #  use-github-hosted-runners). Sin checkout, el workspace solo tiene lo que
      # descarga de artefactos, y bin/verifica-barriento.py NO EXISTE: python3
      # sale con 2 y el paso se pone rojo. Los 5 jobs que fallaron en el run
      # 38494353906 tenian exactamente ese patron: barriendo ok, verificar FALLA.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist}
      - uses: actions/download-artifact@v4
        with: {name: planes, path: planes}

      # El binario pierde el bit de ejecucion al pasar por el artefacto (zip no
      # guarda permisos). Sin esto, "./dist/grind28" da Permission denied (126).
      - name: Permissions
        run: chmod +x dist/grind28

      - name: comprobando la puerta de ESTA celda antes de contar nada
        run: ./dist/grind28 --gate-check "dist/gates/cellgate_${{ matrix.celda }}.dat"

      - name: barriendo
        run: |
          mkdir -p "run/${{ matrix.celda }}-${{ matrix.trozo }}"
          # SIN TEE. Con `grind28 ... | tee log` el estado que ve `set -e` es el
          # de tee, que es 0, y un "FATAL:" por stderr dejaba el job en VERDE sin
          # haber barriido nada. 26 jobs asi en el run 38491791257.
          #
          # --seconds deja que el motor cierre y guarde ANTES del limite de 6 h.
          LOG="sweep-${{ matrix.celda }}-${{ matrix.trozo }}.log"
          rc=0
          ./dist/grind28 \
            --plan "planes/${{ matrix.celda }}__${{ matrix.trozo }}.json" \
            --run-dir "run/${{ matrix.celda }}-${{ matrix.trozo }}" \
            --threads 2 \
            --seconds 19000 > "$LOG" 2>&1 || rc=$?
          cat "$LOG"
          echo "grind28 devolvio $rc"
          # OJO: el motor devuelve 1 cuando agota --seconds, aunque cierre con
          # checkpoint. Un exit 1 no es por si mismo un fallo: hay que mirar el
          # log. Cobertura parcial no es fallo; un FATAL si.
          if [ "$rc" -ne 0 ]; then
            if grep -q "interrupted (checkpointed" "$LOG"; then
              echo "::notice::llego al tope de --seconds y cerro con checkpoint. Cobertura parcial, no es un fallo."
            else
              echo "::error::grind28 devolvio $rc SIN cerrar con checkpoint. Fallo real."
              exit "$rc"
            fi
          fi

      - name: COMPROBANDO que este job ha barriado de verdad
        run: python3 bin/verifica-barriento.py "run/${{ matrix.celda }}-${{ matrix.trozo }}/STATUS.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: res-${{ matrix.celda }}-${{ matrix.trozo }}
          path: run/${{ matrix.celda }}-${{ matrix.trozo }}

  informe:
    name: INFORME
    needs: barrer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Tambien faltaba checkout aqui: bin/informe.py no existia en este job.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {pattern: "res-*", path: res, merge-multiple: true}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: dist, path: dist}

      - name: resumen
        run: python3 bin/informe.py res dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe
          path: resultados.json